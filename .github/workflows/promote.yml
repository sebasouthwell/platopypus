# Promote: move the `stable` update channel (what boxes install by default) to a commit, only if CI passes on it,
# then tag and release it. Run from the Actions tab, or: gh workflow run promote.yml -f ref=master
name: Promote to stable

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit to promote
        default: master
        required: true
      allow_rewind:
        description: Allow stable to move to a commit that does not contain the current stable (rollback)
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-24.04
    outputs:
      sha: ${{ steps.r.outputs.sha }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: r
        run: |
          SHA=$(git rev-parse --verify "origin/${{ inputs.ref }}^{commit}" 2>/dev/null || git rev-parse --verify "${{ inputs.ref }}^{commit}")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Promoting ${{ inputs.ref }} = $SHA"

  ci:
    needs: resolve
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}

  # GitHub refuses pushes from the workflow token that add or change files in .github/workflows. With a
  # PROMOTE_TOKEN secret (fine-grained PAT: this repo, Contents + Workflows read/write) the workflow moves stable
  # itself; without one, such a promotion stops here after CI passes and scripts/promote.ps1 pushes the tested commit
  # from your machine, which starts release.yml through its push trigger.
  move:
    needs: [resolve, ci]
    runs-on: ubuntu-24.04
    outputs:
      pushed: ${{ steps.m.outputs.pushed }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.PROMOTE_TOKEN || github.token }}
      - name: Move stable
        id: m
        env:
          HAS_PAT: ${{ secrets.PROMOTE_TOKEN != '' }}
        run: |
          set -euo pipefail
          SHA=${{ needs.resolve.outputs.sha }}
          git fetch -q origin stable || true
          if git rev-parse -q --verify origin/stable >/dev/null; then
            if ! git merge-base --is-ancestor origin/stable "$SHA"; then
              if [ "${{ inputs.allow_rewind }}" != "true" ]; then echo "::error::$SHA does not contain the current stable ($(git rev-parse --short origin/stable)). Re-run with allow_rewind to roll stable back."; exit 1; fi
              echo "Rolling stable back from $(git rev-parse --short origin/stable)"
            fi
          fi
          if [ "$HAS_PAT" != "true" ] && git diff --name-only "$(git rev-parse -q --verify origin/stable || git hash-object -t tree /dev/null)" "$SHA" -- .github/workflows | grep -q .; then
            echo "::warning::CI passed on $SHA, but it changes .github/workflows, which the workflow token may not push. Push it yourself: git push origin $SHA:refs/heads/stable (scripts/promote.ps1 -Wait does this), or add a PROMOTE_TOKEN secret."
            echo "pushed=false" >> "$GITHUB_OUTPUT"
            echo "CI passed; stable NOT moved (workflow files changed). Push $SHA to stable from your machine." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git push -f origin "$SHA:refs/heads/stable"
          echo "pushed=true" >> "$GITHUB_OUTPUT"
          echo "stable -> $(echo $SHA | cut -c1-7)" >> "$GITHUB_STEP_SUMMARY"

  # A push made with the workflow token does not start release.yml by itself, so call it directly.
  release:
    needs: [resolve, move]
    if: needs.move.outputs.pushed == 'true'
    uses: ./.github/workflows/release.yml
    with:
      ref: ${{ needs.resolve.outputs.sha }}
      tested: true
