# Shared nginx bits for Porthole (installed to /etc/nginx/conf.d/porthole-snippets.conf).

limit_req_zone $binary_remote_addr zone=porthole_login:1m rate=6r/m;
limit_req_zone $binary_remote_addr zone=porthole_api:10m  rate=30r/s;
limit_req_status 429;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server_tokens off;
