# Porthole behind nginx. certbot --nginx adds the TLS server block, redirect and HSTS.
# Placeholder __DOMAIN__ is replaced by install.sh.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    # Hide what this is from scanners that hit the bare IP.
    if ($host != "__DOMAIN__") { return 444; }

    client_max_body_size 600m;
    client_body_timeout 600s;

    # Sign-in and first-run setup are the only unauthenticated endpoints: throttle them hard.
    location ~ ^/api/(login|setup)(/|$) {
        limit_req zone=porthole_login burst=8 nodelay;
        include /etc/nginx/conf.d/porthole-proxy.inc;
    }

    # WebSocket terminals: long-lived.
    location /ws/ {
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
        include /etc/nginx/conf.d/porthole-proxy.inc;
    }

    location / {
        limit_req zone=porthole_api burst=60 nodelay;
        proxy_read_timeout 600s;
        include /etc/nginx/conf.d/porthole-proxy.inc;
    }
}
