# PlatOpypus behind nginx with a Let's Encrypt certificate. Rendered by install.sh once the certificate exists
# (certbot is used in certonly mode, so this file is owned by PlatOpypus and safe to re-render on every update).
# Placeholder __DOMAIN__ is replaced by install.sh.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    if ($host != "__DOMAIN__") { return 444; }

    # ACME http-01 renewals
    location ^~ /.well-known/acme-challenge/ { root /var/www/html; }

    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name __DOMAIN__;

    ssl_certificate     /etc/letsencrypt/live/__DOMAIN__/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/__DOMAIN__/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    if ($host != "__DOMAIN__") { return 444; }

    client_max_body_size 600m;
    client_body_timeout 600s;

    # Sign-in and first-run setup are the only unauthenticated endpoints: throttle them hard.
    location ~ ^/api/(login|setup)(/|$) {
        limit_req zone=plato_login burst=8 nodelay;
        include /etc/nginx/conf.d/platopypus-proxy.inc;
    }

    # WebSocket terminals: long-lived.
    location /ws/ {
        proxy_read_timeout 12h;
        proxy_send_timeout 12h;
        include /etc/nginx/conf.d/platopypus-proxy.inc;
    }

    location / {
        limit_req zone=plato_api burst=60 nodelay;
        proxy_read_timeout 600s;
        include /etc/nginx/conf.d/platopypus-proxy.inc;
    }
}
