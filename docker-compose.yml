services:
  porthole:
    build: .
    image: porthole:dev
    container_name: porthole
    ports:
      - "127.0.0.1:7332:7331"   # host 7331 is taken by the netsh portproxy (LAN access); point that rule at 127.0.0.1:7332
    environment:
      PORTHOLE_TOKEN: ${PORTHOLE_TOKEN:-porthole-test}   # setup token for the first run
      # Passkeys need https/localhost; over the LAN http address only a password works, so allow password-only setup here.
      PORTHOLE_ALLOW_PASSWORD_ONLY: "1"
      # Containers started from here publish on the host, not in this container.
      PORTHOLE_DOCKER_HOST: host.docker.internal
    volumes:
      - porthole-home:/root
      # Lets the Docker section of the UI be tested locally against the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    group_add:
      - "0"
    init: true
    restart: unless-stopped

volumes:
  porthole-home:
